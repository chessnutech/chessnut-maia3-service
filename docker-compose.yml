services:
  maia3:
    image: python:3.14
    container_name: maia3
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAIA3_BOT_SESSION_POOL_SIZE: "2"
      MAIA3_REVIEW_SESSION_POOL_SIZE: "2"
    command: >
      sh -c "
        python -m pip install --upgrade pip &&
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi &&
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8891
      "
    restart: unless-stopped
    ports:
      - "8891:8891"
